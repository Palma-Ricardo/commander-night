# mage.* classes log through the log4j 1.x API (implemented by reload4j).
# Our own code logs via slf4j+logback; this file only covers the XMage side.
log4j.rootLogger=INFO, console
log4j.appender.console=org.apache.log4j.ConsoleAppender
log4j.appender.console.layout=org.apache.log4j.PatternLayout
log4j.appender.console.layout.ConversionPattern=%d{HH:mm:ss.SSS} %-5p xmage:%c{1} %m%n
