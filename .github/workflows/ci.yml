# Fast tier: every unit suite, on every PR and every push to main. The live
# tiers (mvn -Plive, the e2e/ Playwright specs) need a running XMage server and
# take ~30 min, so they are not here.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bridge:
    name: Bridge unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # XMage isn't on Maven Central. The unit tier only needs the two compile
      # jars, published unmodified from the dist as a release on this repo.
      # On an XMage upgrade: publish a new xmage-jars-<version> release and
      # update these checksums (the version itself is read from bridge/pom.xml).
      MAGE_SHA256: 3dea36cc2893408115dc72142b70748971c313b711126d99c371d909be7527c9
      MAGE_COMMON_SHA256: 5697e308857e866a73b855df2a2a9ddf07a6182f234f90007ac5fa619a7b0b28
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: bridge/pom.xml

      - name: Install XMage compile jars
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(sed -n 's:.*<xmage.version>\(.*\)</xmage.version>.*:\1:p' bridge/pom.xml)
          mkdir -p "$RUNNER_TEMP/xmage" && cd "$RUNNER_TEMP/xmage"
          gh release download "xmage-jars-$v" --repo "$GITHUB_REPOSITORY" \
            --pattern "mage-$v.jar" --pattern "mage-common-$v.jar"
          printf '%s  %s\n' "$MAGE_SHA256" "mage-$v.jar" \
                            "$MAGE_COMMON_SHA256" "mage-common-$v.jar" | sha256sum -c
          for a in mage mage-common; do
            mvn -B -q install:install-file -Dfile="$a-$v.jar" \
              -DgroupId=org.mage -DartifactId="$a" -Dversion="$v" \
              -Dpackaging=jar -DgeneratePom=true
          done

      - name: mvn test
        working-directory: bridge
        run: mvn -B test -Dxmage.unit-only

  js:
    name: JS unit tests (core · client · table)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm

      - run: npm ci

      - run: npm test
